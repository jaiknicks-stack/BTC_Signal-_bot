name: BTC Signal Check

on:
  schedule:
    # GitHub's minimum cron granularity is 5 minutes, and busy periods can
    # delay it further - treat this as "every 5-15 minutes", not exact.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit bot_state.json back

concurrency:
  group: btc-signal-check
  cancel-in-progress: false   # never cancel a run that might be mid-alert

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one signal check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_METHOD: ${{ secrets.NOTIFY_METHOD }}
          PIPEDREAM_WEBHOOK_URL: ${{ secrets.PIPEDREAM_WEBHOOK_URL }}
          PIPEDREAM_PAYLOAD_FORMAT: ${{ secrets.PIPEDREAM_PAYLOAD_FORMAT }}
          INSTRUMENT: ${{ secrets.INSTRUMENT }}
          RISK_PER_TRADE_PCT: ${{ secrets.RISK_PER_TRADE_PCT }}
          ACCOUNT_BALANCE_USD: ${{ secrets.ACCOUNT_BALANCE_USD }}
        run: python check_once.py

      - name: Persist state (avoids duplicate alerts across runs)
        run: |
          git config user.name "btc-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bot_state.json
          git diff --staged --quiet || git commit -m "update signal state [skip ci]"
          git push
